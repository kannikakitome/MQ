<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>星屑ダンジョン</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#1b1d22;--line:#3a3d45;--text:#eee;--muted:#a5a8b0;--accent:#d7c27b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation}
button{border:1px solid #4a4d55;border-radius:9px;background:#30333a;color:#fff;padding:9px 10px;font-weight:700;font-size:13px;touch-action:manipulation}
button:active{background:#565b65;transform:translateY(1px)}
button:disabled{opacity:.35}
#game{width:100%;height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;background:#15171b;overflow:hidden}
#top{flex:none;padding:5px 8px 6px;border-bottom:1px solid var(--line);background:#202228}
#titleRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
#dungeonName{font-size:11px;color:#b9bbc2;white-space:nowrap}
#floorTurn{font-size:12px;font-weight:800;white-space:nowrap}
#turnTrack{height:4px;background:#454851;border-radius:5px;overflow:hidden;margin-top:3px}
#turnBar{height:100%;width:0;background:var(--accent)}
#status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{font-size:11px;min-width:0;background:#292c32;border-radius:6px;padding:4px 6px}
.statline{display:flex;justify-content:space-between;gap:4px;white-space:nowrap}
.bar{height:4px;background:#484b53;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;background:#e6e6e6}
#hpBar{background:#d96c6c}#foodBar{background:#d5b75d}#expBar{background:#87b6e5}
#main{display:flex;flex:1;min-height:0;flex-direction:column}
#stage{flex:0 0 64%;min-height:0;display:flex;align-items:center;justify-content:center;background:#08090b;overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
#canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated}
#bottom{flex:1;min-height:0;display:grid;grid-template-columns:1fr;grid-template-rows:minmax(68px, .34fr) minmax(0, .66fr);gap:6px;padding:6px;background:#1a1c21}
#logPanel{grid-row:1;max-height:100%;min-height:0}
#log{max-height:3.9em;line-height:1.3}
#logTitle{display:none}#log{max-height:none}
#bottomLower{grid-row:2;display:grid;grid-template-columns:minmax(80px,.65fr) minmax(250px,1.35fr);gap:6px;min-height:0}
#mapPanel{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid #383b43;border-radius:8px;padding:4px;gap:3px;overflow:hidden}
#miniMapCanvas{display:block;width:100%;height:100%;min-height:0;object-fit:contain;image-rendering:pixelated;background:#070809;cursor:pointer;touch-action:none}
#miniMapTitle{font-size:11px;font-weight:800;flex:none}

#logPanel{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid #383b43;border-radius:8px;overflow:hidden}
#logTitle{font-size:10px;font-weight:800;padding:5px 7px;color:#b9bbc2;border-bottom:1px solid #383b43;flex:none}
#log{overflow:auto;min-height:0;padding:4px 6px;font-size:11px;line-height:1.35;overscroll-behavior:contain}
.logline{padding:3px 0;border-bottom:1px solid #292c32;overflow-wrap:anywhere}
#controlPanel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch;gap:6px;min-width:0;min-height:0;overflow:hidden}#commandPanel,#directionPanel{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:0}#quickActions{grid-template-columns:repeat(2,minmax(0,1fr));}
.dpad{display:grid;grid-template-columns:repeat(3,minmax(34px,48px));grid-template-rows:repeat(3,minmax(32px,43px));gap:3px}
.dpad button{padding:0;font-size:20px}
.dpad .wait{font-size:14px;background:#484b52}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;width:100%;max-width:270px}.actions.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.actions button{width:100%;min-width:0;min-height:29px;padding:4px 3px;font-size:11px;line-height:1.1;white-space:nowrap}
#dashState{display:none}#centerDashBtn.active{background:#b8860b;color:#fff2a8;box-shadow:0 0 10px #ffd44788}#toast{font-weight:700}
#quickActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-items:center;min-height:24px;width:100%;max-width:270px}
#quickActions button{width:100%;min-width:0;min-height:22px;padding:2px 3px;font-size:10px;line-height:1.1}
#aimCancelBtn{display:none}
#overlays{position:absolute;inset:0;pointer-events:none;z-index:10}
.overlay{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:12px;pointer-events:auto}
.modal{width:min(560px,100%);max-height:92%;overflow:auto;background:#22252b;border:1px solid #555a65;border-radius:13px;padding:14px;box-shadow:0 12px 45px #000}
.modal h2{font-size:18px;margin:0 0 10px}.overlayTopbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}.overlayTopbar h2{margin:0}.overlayTopbar button{flex:0 0 auto;min-height:30px;padding:4px 12px}
.modal p{font-size:13px;color:#c5c7cd}
.modalActions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.menuGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.itemList{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.itemRow{display:flex;align-items:center;gap:6px;border:0;border-radius:8px;padding:0}
.itemRow .itemName{flex:1;min-width:0;text-align:left;font-size:13px;overflow-wrap:anywhere;border:1px solid #41444d;border-radius:8px}
.itemRow .itemName.dim{color:#858891}
.itemRow button{padding:6px 8px;font-size:11px}
#itemDetail{margin-top:10px;padding:10px;background:#191b20;border-radius:8px}
#itemDetail h3{margin:0 0 6px;font-size:15px}
.actionChoices{display:flex;flex-wrap:wrap;gap:6px}
.actionChoices button{font-size:12px}
.small{font-size:11px;color:#a9abb3}
.inventoryModal{display:flex;flex-direction:column;overflow:hidden;max-height:92%;}
.inventoryHeader{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;background:#22252b;padding-bottom:5px;border-bottom:1px solid #3a3d45}
.inventoryHeader h2{font-size:17px;margin:0;min-width:0}.inventoryTools{display:flex;gap:5px;flex:none}.inventoryTools button{padding:6px 9px;font-size:12px}
.inventoryScroll{flex:1;min-height:0;overflow:hidden;overscroll-behavior:contain;padding-bottom:4px}.inventoryScroll #inventoryList{overflow:hidden}
#inventoryHint{display:none}
.itemRow.selected{border-color:#8ccfff;box-shadow:none}.itemRow.kb-focus-row{border-color:#8ccfff;box-shadow:none}.itemRow .itemName.kb-focus{outline:none}.itemRow.selected.kb-focus-row{border-color:#8ccfff}
#inventoryOverlay{align-items:flex-start;padding-top:6px}
#inventoryOverlay .inventoryModal{max-height:calc(100vh - 18px)}
.itemRow.selected{display:block;border-color:#f0d36d;box-shadow:0 0 0 2px #e9c55355;background:#292a2b}
.itemRow.kb-focus,.itemRow.kb-focus-row{border-color:#8ccfff;box-shadow:0 0 0 2px #7fcaff66}.itemRow.selected{border-color:#8ccfff;box-shadow:none}.itemRow.kb-focus-row{border-color:#8ccfff;box-shadow:none}.itemRow.selected.kb-focus-row{border-color:#8ccfff;box-shadow:none}.actionChoices button.kb-focus,.modalActions button.kb-focus,.menuGrid button.kb-focus{outline:2px solid #ffe27a;outline-offset:2px;background:#55513a}
.mapModal{display:flex;flex-direction:column;align-items:center;overflow:hidden}.mapModal h2{align-self:flex-start}.mapModal canvas{touch-action:none;cursor:grab;width:min(82vw,68vh);height:min(82vw,68vh);max-width:100%;max-height:74vh;object-fit:contain;image-rendering:pixelated;background:#050607;border:1px solid #555}.logArchive{max-height:65vh;overflow:auto;line-height:1.5;font-size:13px}.logArchive div{padding:2px 0;border-bottom:1px solid #333}

#toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#292c32eF;border:1px solid #555;border-radius:20px;padding:6px 12px;font-size:12px;display:none;z-index:5;white-space:nowrap}
@media(min-width:650px){
 #game{max-height:1000px;border-left:1px solid #333;border-right:1px solid #333}
 #stage{flex-basis:67%}
 #bottomLower{grid-template-columns:minmax(140px,.75fr) minmax(360px,1.25fr)}
 .dpad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,48px)}
 .actions{max-width:340px}.actions button{font-size:12px}
}
@media(max-height:620px){
 #top{padding:3px 6px}#stage{flex-basis:58%}#bottom{padding:4px;grid-template-rows:minmax(54px,.3fr) minmax(0,.7fr)}
 .dpad{grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,25px);gap:2px}
 .dpad button{font-size:15px}.actions{gap:3px}.actions button{min-height:22px;padding:2px;font-size:10px;line-height:1}#dashState{min-height:10px}.stat{padding:3px 5px}
}
.itemRow.selected,.itemRow.kb-focus-row{border:0!important;box-shadow:none!important;background:transparent!important}.itemRow.selected .itemName,.itemRow.kb-focus-row .itemName{border-color:#8ccfff!important;box-shadow:none!important}.itemRow .itemName.kb-focus{outline:none!important}
</style>
</head>
<body>
<div id="game">
 <header id="top">
  <div id="titleRow"><span id="dungeonName">星屑の迷宮</span><span id="floorTurn">B1F　0/1000ターン</span></div>
  <div id="turnTrack"><div id="turnBar"></div></div>
  <div id="status">
   <div class="stat"><div class="statline"><span>Lv <b id="lvText">1</b></span><span id="expText">EXP 0/10</span></div><div class="bar"><i id="expBar"></i></div></div>
   <div class="stat"><div class="statline"><span>HP</span><b id="hpText">20/20</b></div><div class="bar"><i id="hpBar"></i></div></div>
   <div class="stat"><div class="statline"><span>満腹度</span><b id="foodText">100/100</b></div><div class="bar"><i id="foodBar"></i></div></div>
   <div class="stat"><div class="statline"><span>所持金</span><b id="moneyText">0 G</b></div><div class="bar"><i id="moneyBar"></i></div></div>
  </div>
 </header>
 <main id="main">
  <section id="stage"><canvas id="canvas" width="560" height="448"></canvas><div id="toast"></div></section>
  <section id="bottom">
   <div id="logPanel"><div id="logTitle">冒険ログ</div><div id="log"></div></div>
   <div id="bottomLower">
    <div id="mapPanel"><div id="miniMapTitle">全体マップ</div><canvas id="miniMapCanvas" width="250" height="250"></canvas></div>
    <div id="controlPanel">
     <div id="commandPanel">
      <div id="quickActions"><span id="dashState"></span><button id="attackBtn">攻撃</button><button id="shootBtn">射撃</button><button id="aimCancelBtn">キャンセル</button></div>
      <div class="actions two"><button id="inventoryQuickBtn">所持品</button><button id="abilityQuickBtn">能力</button></div>
      <div class="actions two"><button id="statusQuickBtn">状態</button><button id="infoQuickBtn">情報</button></div>
      <div class="actions two"><button id="footBtn">足元</button><button id="aroundQuickBtn">周囲</button></div>
     </div>
     <div id="directionPanel">
      <div class="dpad">
       <button data-dir="-1,-1" aria-label="左上">↖</button><button data-dir="0,-1" aria-label="上">↑</button><button data-dir="1,-1" aria-label="右上">↗</button>
       <button data-dir="-1,0" aria-label="左">←</button><button class="wait" id="centerDashBtn" aria-label="ダッシュ">⚡</button><button data-dir="1,0" aria-label="右">→</button>
       <button data-dir="-1,1" aria-label="左下">↙</button><button data-dir="0,1" aria-label="下">↓</button><button data-dir="1,1" aria-label="右下">↘</button>
      </div>
      <div class="actions two"><button id="directionBtn">方向</button><button id="waitBtn">待機</button></div>
     </div>
    </div>
   </div>
  </section>
 </main>
 <div id="overlays">
  <div class="overlay" id="infoOverlay"><div class="modal"><div class="overlayTopbar"><h2>情報</h2><button id="infoBackBtn">戻る</button></div><div class="menuGrid"><button id="enemyInfoBtn">敵の情報</button><button id="dungeonInfoBtn">ダンジョン</button><button id="catalogExportBtn">出力</button><button id="catalogImportBtn">入力</button><button id="giveUpBtn">ギブアップ</button></div><input type="file" id="catalogFileInput" accept="application/json,.json" style="display:none"><div id="infoDetails" class="itemList"></div></div></div>
  <div class="overlay" id="townOverlay"><div class="modal"><h2 id="townTitle">&#x661F;&#x5C51;&#x306E;&#x8857;</h2><div id="townDetails" class="small"></div><div class="modalActions"><button data-close>&#x9589;&#x3058;&#x308B;</button></div></div></div>
  <div class="overlay" id="townEntryOverlay"><div class="modal"><h2>&#x30C0;&#x30F3;&#x30B8;&#x30E7;&#x30F3;&#x306B;&#x6311;&#x6226;&#x3057;&#x307E;&#x3059;&#x304B;&#xFF1F;</h2><div class="modalActions"><button id="townEntryYesBtn">&#x306F;&#x3044;</button><button id="townEntryNoBtn">&#x3044;&#x3044;&#x3048;</button></div></div></div>
  <div class="overlay" id="inventoryOverlay"><div class="modal inventoryModal"><div class="inventoryHeader"><h2><span id="inventoryTitle">所持品</span> <span class="small" id="inventoryCount"></span></h2><div class="inventoryTools"><button id="sortInventoryBtn">整頓</button><button data-close>閉じる</button></div></div><p class="small" id="inventoryHint"></p><div id="inventoryScroll" class="inventoryScroll"><div id="inventoryList" class="itemList"></div><div id="itemDetail" style="display:none"></div></div></div></div>
  <div class="overlay" id="mainMenuOverlay"><div class="modal"><div class="overlayTopbar"><h2>メニュー</h2><button id="mainMenuCloseBtn" data-close>閉じる</button></div><div class="menuGrid"><button id="menuInventoryBtn">所持品</button><button id="menuAbilityBtn">能力</button><button id="menuStatusBtn">状態</button><button id="menuInfoBtn">情報</button><button id="menuFootBtn">足元</button><button id="menuAroundBtn">周囲</button></div></div></div>
  <div class="overlay" id="abilityOverlay"><div class="modal"><div class="overlayTopbar"><h2>能力</h2><button id="abilityBackBtn">戻る</button></div><div id="abilityDetails" class="small">現在、使用できる固有能力はありません。</div></div></div>
  <div class="overlay" id="aroundOverlay"><div class="modal"><h2>周囲</h2><div id="aroundDetails" class="itemList"></div><div class="modalActions"><button data-close>戻る</button></div></div></div>
  <div class="overlay" id="mapOverlay"><div class="modal mapModal"><h2>全体マップ</h2><canvas id="expandedMapCanvas" width="500" height="500"></canvas><div class="modalActions"><button data-close>閉じる</button></div></div></div>
  <div class="overlay" id="logOverlay"><div class="modal"><h2>メッセージログ</h2><div id="logArchive" class="logArchive"></div><div class="modalActions"><button data-close>閉じる</button></div></div></div>
  <div class="overlay" id="statusOverlay"><div class="modal"><div class="overlayTopbar"><h2>冒険者の状態</h2><button id="statusBackBtn">戻る</button></div><div id="statusDetails"></div></div></div>
  <div class="overlay" id="deathOverlay"><div class="modal"><h2>冒険はここで終わった…</h2><p id="deathText"></p><div class="modalActions"><button id="reviveBtn">復活</button><button id="restartBtn">新しい冒険</button></div></div></div>
  <div class="overlay" id="floorOverlay"><div class="modal"><h2 id="floorTitle">フロアを下りますか？</h2><p id="floorText"></p><div class="modalActions"><button id="continueBtn">はい</button><button id="floorNoBtn">いいえ</button></div></div></div>
  <div class="overlay" id="trapOverlay"><div class="modal"><h2 id="trapTitle"></h2><p>踏みますか？</p><div class="modalActions"><button id="trapYesBtn">はい</button><button id="trapNoBtn">いいえ</button></div></div></div>
 </div>
</div>
<script>
(() => {
'use strict';
const W=50,H=50,TILE=20,MAX_TURNS=1000,MAX_ITEMS=20;
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');

let floor=1,turn=0,player,enemies=[],items=[],townItems=[],traps=[],stairs,rooms=[],explored,visible,lastPlayerTile=null;

let visitedTiles=new Set(),floorNotes=new Map(),adventureNPCs=new Map(),adventureItems=new Map();
let debugFullSense=false;
let aimState=null,attackAim=false,identifiedEnemies=new Map(),killsByName={},detailIdentifyId=null,inventorySelectMode=null;
let level=1,exp=0,maxHp=20,hp=20,food=100,money=100,weapon=null,shield=null,accessory=null,shooting=null;
let jarViewId=null,jarViewPage=0,jarPutId=null,pendingJarPutId=null,jarPutReturnId=null,jarPutReturnPage=0,jarPutSelectedItemId=null,dashInterrupted=false,townStorageJar=null;
let moveSteps=0,hpRegenRemainder=0;
let directionMode=false,directionButtonMode=false,diagonalTriggered=false,pendingX=false,dashModifierConsumed=false,lookMode=false,lookOffsetX=0,lookOffsetY=0;const heldKeys=new Set(),pressedDirections=new Map();
let townMode=true,townX=7,townY=2,townActionNpc=null,selectedTrap=null,facing={x:0,y:1},adjacentDirectionCycle=-1,adjacentDirectionSignature='';
const TOWN_W=15,TOWN_H=11,townMap=Array.from({length:TOWN_H},(_,y)=>Array.from({length:TOWN_W},(_,x)=>x<2||y<2||x>=TOWN_W-2||y>=TOWN_H-2?'#':'.'));
for(let y=4;y<=5;y++)for(let x=2;x<=4;x++)townMap[y][x]='#';townMap[4][3]='I';townMap[5][3]='.';
for(let y=4;y<=5;y++)for(let x=6;x<=8;x++)townMap[y][x]='#';townMap[4][7]='B';townMap[5][7]='.';
for(let y=4;y<=5;y++)for(let x=10;x<=12;x++)townMap[y][x]='#';townMap[4][11]='W';townMap[5][11]='.';townMap[1][7]='>';townMap[7][5]='V';
const townIdentity={I:{place:'星屑道具店',name:'ミナ',intro:'道具屋のミナです。'},B:{place:'星銀銀行',name:'ソラ',intro:'銀行員のソラです。'},W:{place:'月影倉庫',name:'ゴン',intro:'倉庫番のゴンです。'},V:{place:'村人',name:'ハル',intro:'村人のハルです。'}};

 bread:{name:'\u304a\u304a\u304d\u306a\u30d1\u30f3',appearance:'\u4e7e\u3044\u305f\u30d1\u30f3',actions:['\u98df\u3079\u308b','\u6295\u3052\u308b','\u7f6e\u304f','\u8aac\u660e'],desc:'\u6e80\u8179\u5ea6\u3092\u56de\u5fa9\u3059\u308b\u30d1\u30f3\u3002',effect:'food'},
  terrainScroll:{name:'地形感知の巻物',appearance:'川模様の巻物',actions:['使う','投げる','置く','説明'],desc:'フロアの地形（通路・部屋・壁・水路）をすべて把握する。',effect:'terrain'},
  scroll:{name:'\u9451\u5b9a\u306e\u5dfb\u7269',appearance:'\u6587\u5b57\u306e\u8aad\u3081\u306a\u3044\u5dfb\u7269',actions:['\u4f7f\u3046','\u6295\u3052\u308b','\u7f6e\u304f','\u8aac\u660e'],desc:'\u6240\u6301\u54c1\u3092\u9078\u3073\u5b8c\u5168\u9451\u5b9a\u3059\u308b\u3002',effect:'identify'},
 wand:{name:'\u30ef\u30fc\u30d7\u306e\u6756',appearance:'\u9ec4\u571f\u8272\u306e\u6756',actions:['\u632f\u308b','\u6295\u3052\u308b','\u7f6e\u304f','\u8aac\u660e'],desc:'\u5f53\u305f\u3063\u305f\u76ee\u6a19\u3092\u5225\u306e\u5834\u6240\u3078\u98db\u3070\u3059\u3002',effect:'warp'},

function roomAt(x,y){return rooms.find(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);}

   if(inBounds(x,y)){visible.add(key(x,y));explored[y][x]=true;}
  }

  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){

function projectilePath(dx,dy,mode='throw',it=null){const path=[];let x=player.x,y=player.y;for(let i=0;i<10;i++){const nx=x+dx,ny=y+dy;if(isWall(nx,ny)){if(isVisible(nx,ny)||[[-1,0],[1,0],[0,-1],[0,1]].some(([a,b])=>isVisible(nx+a,ny+b)))path.push(key(nx,ny));break;}x=nx;y=ny;if(!isVisible(x,y)&&![[-1,0],[1,0],[0,-1],[0,1]].some(([a,b])=>isVisible(x+a,y+b)))break;path.push(key(x,y));if(enemyAt(x,y))break;}return path;}

function attackEnemy(e){const damage=rand(3,6)+(weapon?2+(weapon.plus||0):0)+level-1;e.hp-=damage;log(e.name+'に'+damage+'ダメージ！');if(e.hp<=0){enemies=enemies.filter(v=>v!==e);exp+=e.exp;killsByName[e.name]=(killsByName[e.name]||0)+1;log(e.name+'を倒した。EXP+'+e.exp);checkLevel();}}
function validEnemySteps(e){const steps=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=e.x+dx,y=e.y+dy;if(!canActorEnter(x,y,e)||!diagonalClear(e.x,e.y,dx,dy)||enemyAt(x,y)||x===player.x&&y===player.y)continue;steps.push({x,y,dx,dy});}return steps;}
function findEnemyPath(e,isGoal){

 for(let i=0;i<queue.length;i++){const cur=queue[i];if((cur.x!==e.x||cur.y!==e.y)&&isGoal(cur.x,cur.y))return{step:cur.first,distance:cur.distance};
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=cur.x+dx,y=cur.y+dy,k=key(x,y);if(seen.has(k)||!canActorEnter(x,y,e)||!diagonalClear(cur.x,cur.y,dx,dy)||enemyAt(x,y)||x===player.x&&y===player.y&&!isGoal(x,y))continue;seen.add(k);queue.push({x,y,first:cur.first||{x:cur.x+dx,y:cur.y+dy},distance:cur.distance+1});}

function patrolCorridorStep(e){const all=validEnemySteps(e).filter(p=>Math.abs(p.dx)+Math.abs(p.dy)===1),options=all.filter(p=>!roomAt(p.x,p.y)),dx=e.moveDx||0,dy=e.moveDy||0;if(dx||dy){const forward=options.find(p=>p.dx===dx&&p.dy===dy);if(forward)return{x:forward.x,y:forward.y};const turns=options.filter(p=>p.dx*dx+p.dy*dy>=0);if(turns.length){turns.sort((a,b)=>(b.dx*dx+b.dy*dy)-(a.dx*dx+a.dy*dy));return{x:turns[0].x,y:turns[0].y};}const roomExits=all.filter(p=>roomAt(p.x,p.y));if(roomExits.length){roomExits.sort((a,b)=>(b.dx*dx+b.dy*dy)-(a.dx*dx+a.dy*dy));return{x:roomExits[0].x,y:roomExits[0].y};}const reverse=options.find(p=>p.dx===-dx&&p.dy===-dy);if(reverse)return{x:reverse.x,y:reverse.y};}if(options.length){const p=options[rand(0,options.length-1)];return{x:p.x,y:p.y};}const roomExits=all.filter(p=>roomAt(p.x,p.y));if(roomExits.length){const p=roomExits[rand(0,roomExits.length-1)];return{x:p.x,y:p.y};}return stepTowardCorridor(e);}

 showLookObjectDetails=function(){if(!lookMode)return;const x=(townMode?townX:player.x)+lookOffsetX,y=(townMode?townY:player.y)+lookOffsetY;let title='',body='';if(!townMode&&!inBounds(x,y)){title='フロア外';body='フロア外';}else if(!townMode&&!explored[y]?.[x]&&!(hasEnemySense()&&enemyAt(x,y))&&!items.some(i=>i.x===x&&i.y===y&&i.discovered)&&!traps.some(t=>t.x===x&&t.y===y&&t.discovered)&&!(stairs?.x===x&&stairs?.y===y&&stairs.discovered)){title='未発見地域';body='未発見地域';}else{if(!townMode){const found=[];if(x===player.x&&y===player.y)found.push({name:'＠',desc:'レベル：'+level+'\nHP：'+hp+'/'+maxHp+'\n満腹度：'+food+'/100'});const e=enemyAt(x,y),it=itemAt(x,y),trap=traps.find(t=>t.x===x&&t.y===y&&t.discovered),stair=stairs?.x===x&&stairs?.y===y&&stairs.discovered;if(e&&(isVisible(x,y)||hasEnemySense()))found.push({name:e.name,desc:'HP：'+e.hp+'/'+e.maxHp+'\n行動：'+(e.behavior||'基本行動')});if(it&&it.discovered)found.push({name:itemLabel(it),desc:(itemDefs[it.type]?.desc||'')+'\n'+itemState(it)});if(trap)found.push({name:trapName(trap),desc:trapCatalog[trap.kind]?.effect||'罠'});if(stair)found.push({name:'階段',desc:'次のフロアへ続く階段'});if(found.length>1){const choice=prompt('情報を見る対象を選択してください：\n'+found.map((v,i)=>(i+1)+'. '+v.name).join('\n'),'1'),chosen=found[Number(choice)-1];if(!chosen)return;title=chosen.name;body=chosen.desc;}else if(found.length){title=found[0].name;body=found[0].desc;}else{title=map[y][x]===2?'水場':map[y][x]===3?'永久壁':map[y][x]===4?'崖':map[y][x]===1?'壁':roomAt(x,y)?'部屋':'通路';body='地形：'+title;}}else{const atPlayer=x===townX&&y===townY;if(atPlayer){title='＠';body='レベル：'+level+'\nHP：'+hp+'/'+maxHp+'\n満腹度：'+food+'/100\n所持金：'+money+' G';}else if(townMap[y]?.[x]==='V'){const n=townIdentity.V;title=n.place+'の'+n.name;body=n.intro;}else if(['I','B','W'].includes(townMap[y]?.[x])){const tile=townMap[y][x],n=townIdentity[tile];title=(tile==='I'?'店':tile==='B'?'銀行':'倉庫')+'：'+n.place;body=n.name;}else if(townMap[y]?.[x]==='>'){title='ダンジョンの入り口';body='ダンジョンに挑戦できます。';}else{const it=itemAt(x,y);if(it){title=itemLabel(it);body=(itemDefs[it.type]?.desc||'')+'\n'+itemState(it);}else{title='街';body='街の地形';}}}if(!title)return;const modal=makeModal('lookObjectOverlay',title,'<pre id="lookObjectBody" style="white-space:pre-wrap"></pre>');modal.querySelector('.overlayTopbar h2').id='lookObjectTitle';modal.querySelector('#lookObjectBody').textContent=body;modal.querySelector('.modalClose').textContent='戻る';modal.querySelector('.modalClose').onclick=()=>hideAllOverlays();showOverlay('lookObjectOverlay');}; function init(){try{const saved=localStorage.getItem('starDungeonCatalog');if(saved)applyCatalogData(JSON.parse(saved),false);}catch(error){console.warn('カタログデータを読み込めませんでした',error);}randomizeDungeonAppearances();resetAdventureStart();townStorageJar=makeItem('jar',9,7);townStorageJar.appearance=itemDefs.jar.appearance;townStorageJar.identified=true;townStorageJar.fully=true;townStorageJar.cursed=false;townStorageJar.blessed=false;townStorageJar.capacity=20;townItems=[townStorageJar,makeTownVisionRing(),makeTownTerrainScroll()];townMode=false;generateFloor();updateVision();fitCanvas();updateStatus();log('\u661f\u5c51\u306e\u8857\u304b\u3089\u5192\u967a\u3092\u59cb\u3081\u3088\u3046\u3002');townMode=true;hideAllOverlays();draw();}
 function bootGame(){let startupError=null;try{init();}catch(error){startupError=error;console.error('ゲームの初期化に失敗しました',error);}try{if(!inventory.length)resetAdventureStart();if(!inventory.some(it=>it.type==='bread'))inventory.unshift(makeStartingBread());if(!inventory.some(it=>it.type==='ring'&&it.fullSense))inventory.push(makeFullSenseRing());if(!townItems.some(it=>it.type==='jar')){townStorageJar=makeItem('jar',9,7);townStorageJar.appearance=itemDefs.jar.appearance;townStorageJar.identified=true;townStorageJar.fully=true;townStorageJar.capacity=20;townItems.unshift(townStorageJar);}if(!townItems.some(it=>it.type==='ring'))townItems.push(makeTownVisionRing());if(!townItems.some(it=>it.type==='terrainScroll'))townItems.push(makeTownTerrainScroll());if(!map||!map.length)generateFloor();townMode=true;hideAllOverlays();fitCanvas();updateStatus();draw();if(startupError)log('初期化を復旧しました：'+(startupError.message||startupError));}catch(error){console.error('ゲームの復旧に失敗しました',error);const el=log;if(el)el.textContent='初期化エラー：'+(error?.message||error);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>requestAnimationFrame(bootGame),{once:true});else requestAnimationFrame(bootGame);
window.addEventListener('resize',()=>{fitCanvas();draw();});
}})();
